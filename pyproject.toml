# Tool configuration for the repository. Deliberately no [project] or
# [build-system] table: this is an application, not a distributable package.
# Every path it uses is relative to the working directory — 'static', 'uploads',
# 'translations', 'translations.db' — so it runs from its checkout and a
# `pip install` of it would create those directories wherever the caller
# happened to be standing and then fail to find the front end. Declaring it
# installable would be a claim the code does not honour.
#
# The runtime dependency list stays in requirements.txt for the same reason:
# launch.py installs that file on every start, and a second copy here would be
# the copy nobody updates.

[tool.pytest.ini_options]
# The modules live in src/, which is where the server also finds them: it is
# started as `python src/translator.py`, and Python puts a script's own
# directory on the path. This line is the same arrangement for the tests, so
# `import translator` means the same module in both.
pythonpath = ["src"]
testpaths = ["tests"]

select = ["E9", "F"]
